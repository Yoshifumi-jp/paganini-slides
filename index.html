<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>悪魔と呼ばれたヴァイオリニスト — パガニーニ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <div id="slides"></div>
      <div id="subtitle"></div>
      <div id="progress"></div>
      <div id="counter"></div>
      <div id="help">
        <h2>操作ヘルプ</h2>
        <ul>
          <li>→ / Space / PageDown / クリック : 次へ</li>
          <li>← / PageUp : 前へ</li>
          <li>Home / End : 最初 / 最後</li>
          <li>N : ナレーション ON/OFF</li>
          <li>M : 音楽・効果音 ミュート</li>
          <li>A : 自動再生 ON/OFF</li>
          <li>F : 全画面切替</li>
          <li>? : 操作ヘルプ表示切替</li>
        </ul>
      </div>
    </div>
  </div>

  <script src="vendor/gsap/gsap.min.js"></script>
